name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova, Setup Icon & Increment Version
      run: |
        npm install -g cordova
        cordova create cordova_app com.esaypass.app EsayPass
        cd cordova_app
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/cordova_app
        rm -rf www/.github
        
        # ربط أيقونة التطبيق
        if [ -f "www/icon.png" ]; then
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
        fi
        
        # رفع رقم Version Code ورقم الإصدار تلقائياً
        BUILD_NUM=${{ github.run_number }}
        sed -i "s/version=\"1.0.0\"/version=\"1.0.${BUILD_NUM}\" android-versionCode=\"${BUILD_NUM}\"/g" config.xml

        cordova platform add android
        cordova build android --release

    - name: Setup Keystore File
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > cordova_app/my-release-key.keystore
        else
          keytool -genkeypair -v -keystore cordova_app/my-release-key.keystore -alias release_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass esaypass123 -keypass esaypass123 -dname "CN=EsayPass, OU=Dev, O=EsayPass, L=City, S=State, C=US"
        fi

    - name: Sign & Align APK
      run: |
        cd cordova_app/platforms/android/app/build/outputs/apk/release
        
        # توقيع التطبيق بالمفتاح الثابت
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../../../../../my-release-key.keystore -storepass esaypass123 -keypass esaypass123 app-release-unsigned.apk release_alias
        
        # إجراء محاذاة الملف Zipalign ليكون جاهزاً للتثبيت المباشر
        ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v 4 app-release-unsigned.apk EsayPass-v${{ github.run_number }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsayPass-v${{ github.run_number }}
        path: cordova_app/platforms/android/app/build/outputs/apk/release/EsayPass-v${{ github.run_number }}.apk
