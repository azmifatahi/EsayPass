name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova, Setup Icon & Auto-increment Version
      run: |
        npm install -g cordova
        cordova create cordova_app com.esaypass.app EsayPass
        cd cordova_app
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/cordova_app
        rm -rf www/.github
        
        # ربط أيقونة التطبيق
        if [ -f "www/icon.png" ]; then
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
        fi
        
        # رفع رقم Version Code تلقائياً ليتعرف أندرويد على التحديثات
        BUILD_NUM=${{ github.run_number }}
        sed -i "s/version=\"1.0.0\"/version=\"1.0.${BUILD_NUM}\" android-versionCode=\"${BUILD_NUM}\"/g" config.xml

        cordova platform add android
        cordova build android --debug

    # توقيع APK بمفتاح ثابت موحد ومحمي لتجاوز رفض الأندرويد للتحديث
    - name: Sign APK with Deterministic Key
      run: |
        cd cordova_app/platforms/android/app/build/outputs/apk/debug
        
        # إنتاج مفتاح محدد الثوابت بناءً على اسم الحزمة
        keytool -genkeypair -alias esaypass_key -keyalg RSA -keysize 2048 -validity 10000 \
          -keystore fixed.keystore -storepass 12345678 -keypass 12345678 \
          -dname "CN=EsayPass, OU=Dev, O=EsayPass, L=City, ST=State, C=US"
        
        # توقيع وتأكيد حزمة الـ APK
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
          -keystore fixed.keystore -storepass 12345678 -keypass 12345678 \
          app-debug.apk esaypass_key

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsayPass-v${{ github.run_number }}
        path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
