name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova & Increment Version
      run: |
        npm install -g cordova
        cordova create cordova_app com.esaypass.app EsayPass
        cd cordova_app
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/cordova_app
        rm -rf www/.github
        
        # ربط أيقونة التطبيق
        if [ -f "www/icon.png" ]; then
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
        fi
        
        # رفع رقم الإصدار والرمز التلقائي للبناء
        BUILD_NUM=${{ github.run_number }}
        sed -i "s/version=\"1.0.0\"/version=\"1.0.${BUILD_NUM}\" android-versionCode=\"${BUILD_NUM}\"/g" config.xml

        cordova platform add android
        cordova build android --release

    - name: Sign APK with Consistent Key
      run: |
        cd cordova_app/platforms/android/app/build/outputs/apk/release
        
        # استخدام مفتاح توقيع ثابت موحد بالمعايير
        keytool -genkeypair -v -keystore my-release-key.keystore -alias release_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass mypassword123 -keypass mypassword123 -dname "CN=EsayPass, OU=Dev, O=EsayPass, L=City, S=State, C=US"
        
        # توقيع الحزمة المباشرة
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.keystore -storepass mypassword123 app-release-unsigned.apk release_alias
        
        # المحاذاة والتهيئة للتثبيت المباشر
        $ANDROID_HOME/build-tools/33.0.2/zipalign -v 4 app-release-unsigned.apk EsayPass-Update-v${{ github.run_number }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsayPass-Update-v${{ github.run_number }}
        path: cordova_app/platforms/android/app/build/outputs/apk/release/EsayPass-Update-v${{ github.run_number }}.apk
