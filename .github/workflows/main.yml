name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova, Setup Icon & Increment Version
      run: |
        npm install -g cordova
        cordova create cordova_app com.esaypass.app EsayPass
        cd cordova_app
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/cordova_app
        rm -rf www/.github
        
        # ربط أيقونة التطبيق في ملف config.xml الخاص بـ Cordova
        if [ -f "www/icon.png" ]; then
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
        fi
        
        # رفع رقم الإصدار تلقائياً (android-versionCode) ليتعرف الأندرويد على التحديث
        BUILD_NUM=${{ github.run_number }}
        sed -i "s/version=\"1.0.0\"/version=\"1.0.${BUILD_NUM}\" android-versionCode=\"${BUILD_NUM}\"/g" config.xml

        cordova platform add android
        cordova build android --debug

    # توقيع الـ APK بمفتاح موحد ثابت دون طلب مدخلات تفاعلية
    - name: Sign APK with Fixed Keystore
      run: |
        cd cordova_app/platforms/android/app/build/outputs/apk/debug
        keytool -genkey -noprompt -alias androiddebugkey -dname "CN=Android Debug, OU=Dev, O=EsayPass, L=City, S=State, C=US" -keystore debug.keystore -storepass android -keypass android -validity 10000 -keyalg RSA -keysize 2048
        jarsigner -keystore debug.keystore -storepass android -keypass android app-debug.apk androiddebugkey

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsayPass-v${{ github.run_number }}
        path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
