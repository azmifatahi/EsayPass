name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Prepare Cordova Project and Build
      run: |
        npm install -g cordova
        cordova create cordova_app com.esaypass.app EsayPass
        cd cordova_app
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/cordova_app
        cordova platform add android
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EsayPass-APK
        path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
