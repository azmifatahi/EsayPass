name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova, Set Permissions & Build
      run: |
        npm install -g cordova
        cordova create cordova_app com.esaypass.app EsayPass
        cd cordova_app
        rm -rf www/*
        cp -r ../* www/ 2>/dev/null || true
        rm -rf www/cordova_app
        rm -rf www/.github
        
        # 1. ربط أيقونة التطبيق
        if [ -f "www/icon.png" ]; then
          sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
        fi
        
        # 2. إضافة أذونات الصوت، الميكروفون، الإنترنت، والإشعارات
        sed -i '/<\/widget>/i \    <config-file target="AndroidManifest.xml" parent="/*" xmlns:android="http://schemas.android.com/apk/res/android">' config.xml
        sed -i '/<\/widget>/i \        <uses-permission android:name="android.permission.RECORD_AUDIO" />' config.xml
        sed -i '/<\/widget>/i \        <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' config.xml
        sed -i '/<\/widget>/i \        <uses-permission android:name="android.permission.INTERNET" />' config.xml
        sed -i '/<\/widget>/i \        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' config.xml
        sed -i '/<\/widget>/i \        <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' config.xml
        sed -i '/<\/widget>/i \    </config-file>' config.xml

        # 3. معالجة زر الرجوع للخلف (تعديل index.html تلقائياً)
        if [ -f "www/index.html" ]; then
          sed -i '/<\/head>/i \  <script src="cordova.js"></script>' www/index.html
          sed -i '/<\/body>/i \  <script>\n    document.addEventListener("deviceready", function() {\n      document.addEventListener("backbutton", function(e) {\n        e.preventDefault();\n        if (window.history.length > 1) {\n          window.history.back();\n        } else {\n          navigator.app.exitApp();\n        }\n      }, false);\n    }, false);\n  </script>' www/index.html
        fi

        # 4. السماح بطلب الإذن بالصوت والميكروفون في WebView
        sed -i '/<\/widget>/i \    <preference name="MediaPlaybackRequiresUserAction" value="false" />' config.xml

        # 5. إخفاء وتعطيل شاشة البداية
        sed -i '/<\/widget>/i \    <preference name="SplashScreen" value="none" />' config.xml
        sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="0" />' config.xml
        sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" />' config.xml
        sed -i '/<\/widget>/i \    <preference name="FadeSplashScreen" value="false" />' config.xml
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/icon.png" />' config.xml
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="#121212" />' config.xml

        # 6. رفع رقم Version Code لضمان قبول التحديثات
        BUILD_NUM=${{ github.run_number }}
        sed -i "s/version=\"1.0.0\"/version=\"1.0.${BUILD_NUM}\" android-versionCode=\"${BUILD_NUM}\"/g" config.xml

        # 7. إضافة منصة الأندرويد
        cordova platform add android

        # 8. إلغاء الشعار الافتراضي من ملفات الموارد (Resources)
        find platforms/android/app/src/main/res/ -name "*ic_cdv_splashscreen*" -delete 2>/dev/null || true

        # 9. إعداد التوقيع الموحد
        keytool -genkeypair -alias esaypasskey -keyalg RSA -keysize 2048 -validity 10000 \
          -keystore release.keystore -storepass 123456 -keypass 123456 \
          -dname "CN=EsayPass, OU=Dev, O=EsayPass, L=City, ST=State, C=US"

        cat <<EOF > build.json
        {
          "android": {
            "debug": {
              "keystore": "release.keystore",
              "storePassword": "123456",
              "alias": "esaypasskey",
              "password": "123456",
              "keystoreType": ""
            }
          }
        }
        EOF

        cordova build android --debug --buildConfig=build.json

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EsayPass-v${{ github.run_number }}
        path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
